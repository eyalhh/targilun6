<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POST Form Example</title>
</head>
<body>
    <h1>POST Request Form</h1>

    <form action="http://localhost:3001/" method="post">
        <label>
            Name:
            <input type="text" name="name">
        </label>
        <br><br>

        <label>
            Age:
            <input type="number" name="age">
        </label>
        <br><br>

        <button type="submit">Submit (POST)</button>
    </form>
</body>
</html>
